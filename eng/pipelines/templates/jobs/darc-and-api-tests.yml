jobs:
- job: Darc_and_API_tests
  displayName: Darc and API tests

  pool:
      name: NetCore1ESPool-Internal
      demands: ImageOverride -equals 1es-windows-2022

  variables:
    - ${{ if in(variables['Build.SourceBranch'], 'refs/heads/production') }}:
      - name: PcsTestEndpoint
        value: https://maestro.dot.net
    - ${{ else }}:
      - name: PcsTestEndpoint
        value: https://maestro.int-dot.net

  steps:
  - powershell: |
      try {
        $response = Invoke-WebRequest "$(PcsTestEndpoint)/api/channels?api-version=2020-02-20" -UseBasicParsing
        $statusCode = $response.StatusCode
      }
      catch {
        $statusCode = [int]$_.Exception.Response.StatusCode
        if ($statusCode -eq 401) {
          exit 0
        }
      }
      finally {
        Write-Host "Anonymous PCS API request returned status code $statusCode"
      }

      exit -1
    displayName: Test PCS anonymous access

  # We only run darc tests on main prod, because otherwise we can't find the build in BAR
  - ${{ if in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/production') }}:
    - download: current
      displayName: Download Darc
      artifact: PackageArtifacts
      patterns: PackageArtifacts/Microsoft.DotNet.Darc.*

    - powershell: |
        # darc ships as a RID-agnostic wrapper package next to one package per runtime identifier
        # (Microsoft.DotNet.Darc.<rid>.<version>.nupkg). Only the wrapper is installable as a tool
        # - it resolves to the RID package matching the machine - and it is the only one whose
        # version follows the package ID directly.
        $darcVersions = @(Get-ChildItem -Path $(Pipeline.Workspace)\PackageArtifacts -Filter Microsoft.DotNet.Darc.*.nupkg |
          ForEach-Object { if ($_.Name -match '^Microsoft\.DotNet\.Darc\.(\d.*)\.nupkg$') { $Matches[1] } })

        if ($darcVersions.Count -ne 1) {
          throw "Expected exactly one Microsoft.DotNet.Darc wrapper package, found $($darcVersions.Count)"
        }

        $darcVersion = $darcVersions[0]
        mkdir darc
        .\eng\common\dotnet.ps1 tool install Microsoft.DotNet.Darc --tool-path .\darc --source $(Pipeline.Workspace)\PackageArtifacts --version $darcVersion
      displayName: Install Darc

    - template: /eng/common/templates-official/steps/get-federated-access-token.yml
      parameters:
        federatedServiceConnection: ArcadeServicesInternal
        outputVariableName: AzdoToken

    - task: AzureCLI@2
      displayName: Test Darc add-build-to-channel
      inputs:
        azureSubscription: "Darc: Maestro Production"
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          $env:DOTNET_ROOT = (Resolve-Path ".\.dotnet").Path
          $darcBuild = .\darc\darc.exe get-build `
            --repo "https://github.com/dotnet/arcade-services" `
            --commit $(Build.SourceVersion) `
            --ci `
            --output-format json |
            ConvertFrom-Json

          .\darc\darc.exe add-build-to-channel `
            --id $darcBuild[0].id `
            --channel "General Testing" `
            --ci `
            --azdev-pat $(AzdoToken)



