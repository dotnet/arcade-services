parameters:
- name: configuration
  type: string
- name: buildArgs
  type: string
  default: ''
- name: sign
  type: boolean
  default: false
# ILCompiler cannot compile across operating systems, so the RID-specific darc tool packages are
# built on an agent per target OS and this step has to pick the matching build script.
- name: windows
  type: boolean
  default: true
# When set, darc is built as the Native AOT tool package for this runtime identifier. Unless the job
# also sets publishAllPackages, that package becomes the only artifact the job signs and publishes -
# Arcade narrows both to packages carrying TargetRid in their name. The rest of the repository is
# still built so that these jobs double as a build check for their platform.
- name: darcRid
  type: string
  default: ''
# Set by the single job that ships the rest of the repository. It keeps Arcade's RID narrowing off
# so that everything the job built gets signed and published, rather than just the darc package for
# its own runtime identifier. That job is win-x64, which is also where the RID-agnostic darc package
# is packed - see Microsoft.DotNet.Darc.csproj.
- name: publishAllPackages
  type: boolean
  default: false

steps:
- ${{ if parameters.windows }}:
  - script: >
      .\eng\common\cibuild.cmd
      -configuration ${{ parameters.configuration }}
      -prepareMachine
      /p:Test=false
      /p:VersionPrefix=$(_VersionPrefix)
      /p:Sign=${{ parameters.sign }}
      /p:TargetRid=${{ parameters.darcRid }}
      /p:EnableDefaultRidSpecificArtifacts=${{ and(ne(parameters.darcRid, ''), not(parameters.publishAllPackages)) }}
      ${{ parameters.buildArgs }}
    displayName: Build
- ${{ else }}:
  - script: >
      ./eng/common/cibuild.sh
      --configuration ${{ parameters.configuration }}
      --prepareMachine
      /p:Test=false
      /p:VersionPrefix=$(_VersionPrefix)
      /p:Sign=${{ parameters.sign }}
      /p:TargetRid=${{ parameters.darcRid }}
      /p:EnableDefaultRidSpecificArtifacts=${{ and(ne(parameters.darcRid, ''), not(parameters.publishAllPackages)) }}
      ${{ parameters.buildArgs }}
    displayName: Build
