parameters:
- name: configuration
  type: string
- name: buildArgs
  type: string
  default: ''
- name: sign
  type: boolean
  default: false

steps:
- script: >
    .\eng\common\cibuild.cmd
    -configuration ${{ parameters.configuration }}
    -prepareMachine
    /p:Test=false
    /p:VersionPrefix=$(_VersionPrefix)
    /p:Sign=${{ parameters.sign }}
    ${{ parameters.buildArgs }}
  displayName: Build
