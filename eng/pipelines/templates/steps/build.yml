parameters:
- name: configuration
  type: string
- name: buildArgs
  type: string
  default: ''
- name: sign
  type: boolean
  default: false
# ILCompiler cannot compile across operating systems, so the RID-specific darc tool packages are
# built on an agent per target OS and this step has to pick the matching build script.
- name: windows
  type: boolean
  default: true
# When set, darc is built as the Native AOT tool package for this runtime identifier. Unless the job
# also sets publishAllPackages, that package becomes the only artifact the job signs and publishes -
# Arcade narrows both to packages carrying TargetRid in their name. The rest of the repository is
# still built so that these jobs double as a build check for their platform.
- name: darcRid
  type: string
  default: ''
# Set by the single job that ships the rest of the repository. It keeps Arcade's RID narrowing off
# so that everything the job built gets signed and published, and it packs the RID-agnostic darc
# meta package in a pass of its own. That extra pass is unavoidable: a RuntimeIdentifier makes the
# SDK emit the RID-specific tool package *instead of* the meta package, so no single build can
# produce both, and the meta package is the one `dotnet tool install Microsoft.DotNet.Darc` resolves
# before redirecting to the package matching the user's RID.
- name: publishAllPackages
  type: boolean
  default: false

steps:
# Only ever runs on the repository build job, which is Windows, hence no non-Windows counterpart.
# It has to come before the main build: Arcade signs and publishes from Sign.proj and Publish.proj,
# which cover everything under artifacts/packages no matter what -projects was scoped to, so the
# meta package only makes it into the build's outputs if it is already on disk by then.
- ${{ if parameters.publishAllPackages }}:
  - script: >
      .\eng\common\build.cmd
      -configuration ${{ parameters.configuration }}
      -ci
      -prepareMachine
      -restore
      -build
      -pack
      -projects $(Build.SourcesDirectory)\src\Microsoft.DotNet.Darc\Darc\Microsoft.DotNet.Darc.csproj
      /p:VersionPrefix=$(_VersionPrefix)
      ${{ parameters.buildArgs }}
    displayName: Pack RID-agnostic darc package

- ${{ if parameters.windows }}:
  - script: >
      .\eng\common\cibuild.cmd
      -configuration ${{ parameters.configuration }}
      -prepareMachine
      /p:Test=false
      /p:VersionPrefix=$(_VersionPrefix)
      /p:Sign=${{ parameters.sign }}
      /p:TargetRid=${{ parameters.darcRid }}
      /p:EnableDefaultRidSpecificArtifacts=${{ and(ne(parameters.darcRid, ''), not(parameters.publishAllPackages)) }}
      ${{ parameters.buildArgs }}
    displayName: Build
- ${{ else }}:
  - script: >
      ./eng/common/cibuild.sh
      --configuration ${{ parameters.configuration }}
      --prepareMachine
      /p:Test=false
      /p:VersionPrefix=$(_VersionPrefix)
      /p:Sign=${{ parameters.sign }}
      /p:TargetRid=${{ parameters.darcRid }}
      /p:EnableDefaultRidSpecificArtifacts=${{ and(ne(parameters.darcRid, ''), not(parameters.publishAllPackages)) }}
      ${{ parameters.buildArgs }}
    displayName: Build
