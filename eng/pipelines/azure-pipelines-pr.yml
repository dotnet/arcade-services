variables:
- template: /eng/pipelines/templates/variables/version-variables.yml
# Cannot use key:value syntax in root defined variables
- name: _PublishUsingPipelines
  value: true
- name: AzdoOrgUri
  value: https://dev.azure.com/dnceng
- name: AzdoProject
  value: internal
- name: configuration
  value: Release

parameters:
# darc ships as a Native AOT RID-specific .NET tool. ILCompiler cannot compile across operating
# systems, so every target OS needs a build agent of its own; cross-architecture compilation within
# one OS does work, which is why Windows and macOS each build both of their architectures while
# linux-arm64 uses a native arm64 agent.
#
# Keep in sync with ToolPackageRuntimeIdentifiers in
# src/Microsoft.DotNet.Darc/Darc/Microsoft.DotNet.Darc.csproj.
- name: darcRidPlatforms
  type: object
  default:
  - rid: win-x64
    jobName: Darc_win_x64
    windows: true
    pool:
      name: NetCore-Public
      demands: ImageOverride -equals 1es-windows-2022-open
  - rid: win-arm64
    jobName: Darc_win_arm64
    windows: true
    pool:
      name: NetCore-Public
      demands: ImageOverride -equals 1es-windows-2022-open
  - rid: osx-x64
    jobName: Darc_osx_x64
    windows: false
    pool:
      name: AcesShared
      demands: ImageOverride -equals ACES_VM_SharedPool_Tahoe
  - rid: osx-arm64
    jobName: Darc_osx_arm64
    windows: false
    pool:
      name: AcesShared
      demands: ImageOverride -equals ACES_VM_SharedPool_Tahoe
  - rid: linux-x64
    jobName: Darc_linux_x64
    windows: false
    pool:
      name: NetCore-Public
      demands: ImageOverride -equals build.azurelinux.3.amd64.open
  - rid: linux-arm64
    jobName: Darc_linux_arm64
    windows: false
    pool:
      name: Docker-Linux-Arm-Public
      demands: ImageOverride -equals build.azurelinux.3.arm64.open

pr:
  branches:
    include:
    - main
    - production
  paths:
    include:
    - '*'
    exclude:
    - '**/*.md'
    - '.github/*'
    - 'docs/*'
    - CODE-OF-CONDUCT.md
    - LICENSE.TXT
    - README.md
    - SECURITY.md
    - THIRD-PARTY-NOTICES.TXT

stages:
- stage: build
  dependsOn: []
  displayName: Build
  variables:
  - name: _BuildConfig
    value: Release
  jobs:
  - template: /eng/common/templates/jobs/jobs.yml
    parameters:
      artifacts:
        publish:
          logs: true
          ${{ if in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/production') }}:
            artifacts: true
            manifests: true
      enableTelemetry: true
      enableMicrobuild: false
      enablePublishTestResults: false
      enablePublishUsingPipelines: ${{ variables._PublishUsingPipelines }}

      jobs:
      - job: Build
        displayName: Build Repo
        timeoutInMinutes: 90
        pool:
          name: NetCore-Public
          demands: ImageOverride -equals 1es-windows-2022-open

        steps:
        - checkout: self
          clean: true

        - template: /eng/pipelines/templates/steps/build.yml
          parameters:
            configuration: $(configuration)

        - template: /eng/pipelines/templates/steps/test.yml
          parameters:
            configuration: $(configuration)

      - job: Builder_Docker
        displayName: Build Docker Image
        pool:
          name: NetCore-Public
          demands: ImageOverride -equals build.azurelinux.3.amd64.open

        steps:
        - checkout: self
          clean: true

        - template: /eng/pipelines/templates/steps/docker-build.yml
          parameters:
            dockerImageName: test

      # One job per darc runtime identifier. Each builds the whole repository - which makes these
      # jobs a build check for their platform on top of producing the package - and publishes only
      # the darc package for its own RID - Arcade narrows that by TargetRid. Tests keep running in the
      # Build job alone.
      - ${{ each platform in parameters.darcRidPlatforms }}:
        - job: ${{ platform.jobName }}
          displayName: Build repository and darc (${{ platform.rid }})
          timeoutInMinutes: 90
          pool: ${{ platform.pool }}
          # The default artifact names are keyed off Agent.Os, which these jobs share with each
          # other and with the jobs above.
          artifacts:
            publish:
              logs:
                name: Logs_${{ platform.jobName }}_$(_BuildConfig)
              ${{ if in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/production') }}:
                artifacts:
                  name: Artifacts_${{ platform.jobName }}_$(_BuildConfig)
          steps:
          - checkout: self
            clean: true

          - template: /eng/pipelines/templates/steps/build.yml
            parameters:
              configuration: $(configuration)
              darcRid: ${{ platform.rid }}
              windows: ${{ platform.windows }}
