variables:
- template: /eng/pipelines/templates/variables/version-variables.yml@self
# Cannot use key:value syntax in root defined variables
- name: _PublishUsingPipelines
  value: true

pr:
  branches:
    include:
    - main
    - production
  paths:
    include:
    - '*'
    exclude:
    - '**/*.md'
    - '.github/*'
    - 'docs/*'
    - CODE-OF-CONDUCT.md
    - LICENSE.TXT
    - README.md
    - SECURITY.md
    - THIRD-PARTY-NOTICES.TXT

stages:
# Same stage the official and dev pipelines run, minus the 1ES pipeline template they extend.
- template: /eng/pipelines/templates/stages/build.yml@self
  parameters:
    is1ESPipeline: false
